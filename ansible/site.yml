---
# ansible/site.yml
#
# The S-2 caged-mode host setup, mechanised: applies acts (1)-(5) of
# ../.gleipnir/plans/s2-activation-control-proposal.md, installs the act-6
# wrapper's perms, and ends with the AC-4 assert -- a FAILING assertion if
# the caged boundary did not genuinely close (BC-7). Caged ENTRY
# (`sudo bin/gleipnir-launch`) is a SEPARATE, later, explicit operator act;
# this playbook never performs it and never can (D2/BC-7).
#
# Authoritative sources this mechanises, never re-authors (BC-1):
#   - acts 1-6:            ../.gleipnir/plans/s2-activation-control-proposal.md
#   - the 8 enforcement
#     paths:                src/gleipnir/preflight/boundary.py:168-222
#   - the converged
#     decision + BC-1..7:   ../.gleipnir/decisions/s2-caged-ansible.md
#   - this plan's Assemble
#     order / Trace:        ../.gleipnir/plans/s2-caged-ansible.md
#
# Run (operator, real box, under sudo so acts 1/3/5/6 can chown/create):
#   sudo ansible-playbook -i inventory.ini site.yml
#
# D4-FU DONE: the 3-layer test harness has been run and passes green
# (syntax-check, ansible-lint production profile, --check, idempotency
# changed=0, AC-4-fail path). See ansible/tests/README.md.

- name: S-2 caged-mode host setup (acts 1-6 + AC-4 assert)
  hosts: local
  connection: local
  gather_facts: true   # needed as a fallback for ansible_user_id (E-5)

  pre_tasks:
    # --- Defense-in-depth: refuse to run with an empty/unset `repo` -------
    # Every recursive perm task (acts 3/4/5/6) is scoped to `{{ repo }}`.
    # An empty or unset `repo` would render those paths as `/.gleipnir/...`
    # etc. The `ansible.builtin.file` module already rejects an empty `path`,
    # and the identity-file stat/fail below would halt an implausible path --
    # but neither is an EXPLICIT guard on `repo` itself. This assert makes the
    # invariant load-bearing and first: no destructive act runs unless `repo`
    # is a defined, non-empty, absolute path. (Quality-review hardening item.)
    - name: "pre: refuse to run unless repo is a defined, non-empty, absolute path"
      ansible.builtin.assert:
        that:
          - repo is defined
          - (repo | string | length) > 0
          - (repo | string) is match('^/')
        fail_msg: >-
          `repo` must be a defined, non-empty, absolute path (it scopes every
          recursive chmod/chown in this playbook). Got: '{{ repo | default('') }}'.
        quiet: true
      tags: [always]

    # --- E-5: resolve the real operator, not root -------------------------
    # Run under `sudo ansible-playbook`, the WHOLE process is already root,
    # so a `command: id -un` task would report "root", not the login user
    # who should own the tree. `sudo` sets $SUDO_USER for the process it
    # launches, so prefer that; fall back to the gathered ansible_user_id
    # fact when not sudo-invoked (e.g. the unprivileged fixture tests in
    # ansible/tests/, which never use sudo).
    - name: "pre: resolve the invoking operator (not root) for chown targets (E-5)"
      ansible.builtin.set_fact:
        operator: "{{ lookup('ansible.builtin.env', 'SUDO_USER') | default(ansible_user_id, true) }}"
      tags: [always]

    # --- P3/E-6: agent-identity.env is the single source of truth --------
    - name: "pre: confirm agent-identity.env is present (P3)"
      ansible.builtin.stat:
        path: "{{ repo }}/.gleipnir/agent-identity.env"
      register: identity_stat
      tags: [always]

    - name: "pre: fail fast if agent-identity.env is missing (E-6)"
      ansible.builtin.fail:
        msg: >-
          {{ repo }}/.gleipnir/agent-identity.env not found. This playbook
          reads the agent uid/gid from it (P3) and deliberately does NOT
          bootstrap a numeric uid/gid itself -- that would reintroduce a
          hardcoded-uid literal this playbook is required to avoid
          (AC-nolit). Run act (2) of s2-activation-control-proposal.md by
          hand first, or restore the file, then re-run.
      when: not identity_stat.stat.exists
      tags: [always]

    - name: "pre: read agent-identity.env content (P3)"
      ansible.builtin.slurp:
        src: "{{ repo }}/.gleipnir/agent-identity.env"
      register: identity_slurp
      tags: [always]

    - name: "pre: parse GLEIPNIR_AGENT_UID / GLEIPNIR_AGENT_GID (single source of truth, P3)"
      ansible.builtin.set_fact:
        agent_uid: "{{ (identity_slurp.content | b64decode) | regex_search('GLEIPNIR_AGENT_UID=([0-9]+)', '\\1') | first }}"
        agent_gid: "{{ (identity_slurp.content | b64decode) | regex_search('GLEIPNIR_AGENT_GID=([0-9]+)', '\\1') | first }}"
      tags: [always]

  tasks:
    # =======================================================================
    # act 1 -- dedicated agent uid/gid (macOS dscl/sysadminctl).
    # `command:`, not ansible.builtin.user (BC-5): unreliable on Darwin for
    # a non-login service account. Query-then-when guard (no `creates` file
    # exists for a dscl account) -- E-1 idempotency.
    # =======================================================================
    - name: "act1: query existing agent account (dscl) -- idempotency guard (P4/BC-5/E-1)"
      ansible.builtin.command: dscl . -read /Users/{{ agent_account_name }} UniqueID
      register: dscl_query
      changed_when: false
      failed_when: false
      when: not ansible_check_mode   # E-8: command: tasks don't support --check
      tags: [act1]

    - name: "act1: create the dedicated agent group record (dscl)"
      ansible.builtin.command: dscl . -create /Groups/{{ agent_account_name }}
      when: not ansible_check_mode and (dscl_query.rc | default(1)) != 0
      # BUG-4 (ansible-lint no-changed-when): this task only ever runs when
      # the query-then-when guard above (dscl_query.rc != 0) found the
      # account absent, so every execution is a genuine creation -- true is
      # the honest, not a suppressed, changed_when (E-1 idempotency signal).
      changed_when: true
      tags: [act1, user_create, destructive]

    - name: "act1: set the agent group PrimaryGroupID"
      ansible.builtin.command: dscl . -create /Groups/{{ agent_account_name }} PrimaryGroupID {{ agent_gid }}
      when: not ansible_check_mode and (dscl_query.rc | default(1)) != 0
      changed_when: true
      tags: [act1, user_create, destructive]

    - name: "act1: set the agent group RecordName"
      ansible.builtin.command: dscl . -create /Groups/{{ agent_account_name }} RecordName {{ agent_account_name }}
      when: not ansible_check_mode and (dscl_query.rc | default(1)) != 0
      changed_when: true
      tags: [act1, user_create, destructive]

    - name: "act1: create the non-login agent user (sysadminctl)"
      ansible.builtin.command: >-
        sysadminctl -addUser {{ agent_account_name }} -UID {{ agent_uid }} -GID {{ agent_gid }}
        -fullName "Gleipnir Agent" -home /var/empty -shell /usr/bin/false
      when: not ansible_check_mode and (dscl_query.rc | default(1)) != 0
      changed_when: true
      tags: [act1, user_create, destructive]

    # =======================================================================
    # act 3 -- ownership / group layout. `ansible.builtin.file` with
    # symbolic modes + recurse (P5) -- idempotent, reports real changed
    # state (drives AC-idem), unlike `command: chown -R`/`chmod -R`.
    #
    # D5 (non-overlapping layering, idempotency fix -- found by the first
    # real test run): act-3's read grant is scoped to `src/` + the
    # NON-enforcement parts of `.gleipnir/` ONLY. It deliberately does NOT
    # recurse over `keys/` or the 8 LOCKED enforcement paths (`agents`,
    # `stage-role-map.md`, `decisions`, `goals`, `keys`, `plugins`,
    # `sandbox`, `AGENTS.md`) -- act-4 already grants the agent read there
    # (`a+rX,go-w` on the 6 dirs + `0644` on the 2 files), and act-5 then
    # locks the key `0600`. The OLD broad `chmod -R a+rX .gleipnir` re-ran
    # every apply, re-loosening exactly what act-4/act-5 had just
    # tightened -- so the SECOND run always reported `changed=2` and the
    # key mode churned instead of converging. The fix makes each path
    # owned by exactly ONE act: act-3 grants (a) a non-recursive `a+rX` on
    # `.gleipnir/` itself (top-level traverse only, so the agent can
    # descend into whatever act-4 opens up) and (b) a recursive `a+rX` on
    # the specific non-enforcement, non-Tier-0/1/2 subtrees named in
    # `non_enforcement_readable_dirs` (`skills/`, `policy/`) -- never
    # `keys/`, never the enforcement subtree. See
    # ../.gleipnir/decisions/s2-caged-ansible.md D5.
    # =======================================================================
    - name: "act3: operator owns the entire repo tree"
      ansible.builtin.file:
        path: "{{ repo }}"
        owner: "{{ operator }}"
        group: staff
        recurse: true
      tags: [act3]

    - name: "act3: src/ readable to all (a+rX, recurse) -- unrelated to the enforcement-subtree overlap, unchanged by D5"
      ansible.builtin.file:
        path: "{{ repo }}/src"
        mode: "a+rX"
        recurse: true
      tags: [act3]

    - name: "act3: .gleipnir/ itself readable+traversable to all (a+rX, NO recurse) -- D5 non-overlapping layering"
      ansible.builtin.file:
        path: "{{ repo }}/.gleipnir"
        mode: "a+rX"
        state: directory
      tags: [act3]

    - name: "act3: stat the non-enforcement .gleipnir/ readable subtrees (D5) -- existence probe, every entry tolerates absence"
      ansible.builtin.stat:
        path: "{{ repo }}/.gleipnir/{{ item }}"
      loop: "{{ non_enforcement_readable_dirs }}"
      register: act3_readable_dir_stat
      tags: [act3]

    # D5 detail (shortened task name below, kept under the lint line-length
    # limit): recurses a+rX only over non_enforcement_readable_dirs
    # (skills/, policy/, etc.) -- NEVER keys/ or the 8 enforcement paths;
    # those remain act4/act5's exclusive domain.
    - name: "act3: non-enforcement .gleipnir/ subtrees readable (a+rX, recurse) -- D5; NEVER keys/ or enforcement paths"
      ansible.builtin.file:
        path: "{{ repo }}/.gleipnir/{{ item.item }}"
        mode: "a+rX"
        recurse: true
      loop: "{{ act3_readable_dir_stat.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists
      tags: [act3]

    - name: "act3: Tier-0/1/2 writable dirs -- chgrp agent + g+w"
      ansible.builtin.file:
        path: "{{ repo }}/{{ item }}"
        group: "{{ agent_account_name }}"
        mode: "g+w"
        recurse: true
      loop: "{{ tier012_writable_dirs }}"
      tags: [act3, act3_agent_group]

    # =======================================================================
    # act 4 -- harden the 8 LOCKED enforcement paths OS-read-only to the
    # agent uid (a+rX,go-w: read+traverse for all, no group/other write).
    #
    # BUG-1 fix: `enforcement_paths` mixes two path SHAPES -- 6 directories
    # (agents, decisions, goals, keys, plugins, sandbox) and 2 files
    # (stage-role-map.md, AGENTS.md). `ansible.builtin.file` errors
    # ("recurse option requires state to be 'directory'") if `recurse: yes`
    # is applied to a file, so the single mixed-loop task this used to be is
    # a real correctness defect. Split into the SAME two sub-passes the
    # authoritative proposal (s2-activation-control-proposal.md act 4) uses:
    #   (a) file-mode  -- stage-role-map.md, AGENTS.md, and each individual
    #                      agents/*.md file: mode 0644, NO recurse.
    #   (b) dir-recurse -- the 6 directory-kind paths: mode a+rX,go-w,
    #                      recurse. plugins/ (and only plugins/, BC-1/E-2)
    #                      tolerates absence.
    #
    # BUG-4 fix (ansible-lint `ignore-errors`): absence-tolerance for
    # plugins/ is no longer a blanket `ignore_errors` (which would also
    # swallow a genuine permission/IO error on that path, not just
    # "absent"). Instead, a `stat` probe explicitly distinguishes "absent
    # and tolerated" (skip the chmod, still a clean PASS) from "absent and
    # NOT tolerated" (explicit `fail`, naming the path) from "present"
    # (chmod runs normally) -- the honest, narrowly-scoped condition BUG-4
    # asked for, not a suppression.
    #
    # D6 fix (idempotency, found by the first real test run): keys/ is
    # special-cased OUT of the generic dir-recurse sub-pass below. A plain
    # `a+rX,go-w` recurse over keys/ re-modes marker.key too, loosening the
    # 600 key every run -- act5 then re-tightens it every run, so layer-3a
    # never converges (changed=2 forever). keys/ now gets its OWN
    # exclude-the-key treatment: the dir NODE is hardened directly
    # (non-recursive), and `ansible.builtin.find` enumerates keys/'s
    # CONTENTS excluding `*.key` so only non-key contents (README.md,
    # future *.digest files) are hardened -- marker.key's mode is never
    # touched here, staying act5's exclusive domain. The other 5
    # directory-kind paths (agents, decisions, goals, plugins, sandbox)
    # have no act5-owned file inside them, so they keep the plain
    # recursive treatment unchanged. See
    # ../.gleipnir/decisions/s2-caged-ansible.md D6.
    # =======================================================================
    - name: "act4: harden the 8 LOCKED enforcement paths -- file-type sub-pass (stage-role-map.md, AGENTS.md), mode 0644, no recurse"
      ansible.builtin.file:
        path: "{{ repo }}/.gleipnir/{{ item.relative }}"
        mode: "0644"
        state: file
      loop: "{{ enforcement_paths | selectattr('kind', 'equalto', 'file') | list }}"
      loop_control:
        label: "{{ item.label }}"
      tags: [act4]

    - name: "act4: harden the 8 LOCKED enforcement paths -- individual agent permission maps (agents/*.md), mode 0644, no recurse"
      # `(enforcement_paths | first).relative` (== "agents") rather than a
      # second hardcoded "agents" literal -- single-sourced from the same
      # group_vars list AC-mirror checks (list order is LOCKED, so `first`
      # is always the agents/*.md entry).
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0644"
        state: file
      with_fileglob: "{{ repo }}/.gleipnir/{{ (enforcement_paths | first).relative }}/*.md"
      tags: [act4]

    - name: "act4: harden the 8 LOCKED enforcement paths -- stat the directory-type paths (existence probe for tolerate_absent handling)"
      ansible.builtin.stat:
        path: "{{ repo }}/.gleipnir/{{ item.relative }}"
      loop: "{{ enforcement_paths | selectattr('kind', 'equalto', 'dir') | list }}"
      loop_control:
        label: "{{ item.label }}"
      register: enforcement_dir_stat
      tags: [act4]

    - name: "act4: harden the 8 LOCKED enforcement paths -- fail fast on a missing, NOT absence-tolerant directory (BC-1/E-2)"
      ansible.builtin.fail:
        msg: >-
          Enforcement path {{ item.item.label }}
          ({{ repo }}/.gleipnir/{{ item.item.relative }}) is missing and is
          NOT absence-tolerant (only plugins/ tolerates absence, BC-1/E-2).
      loop: "{{ enforcement_dir_stat.results }}"
      loop_control:
        label: "{{ item.item.label }}"
      when: not item.stat.exists and not (item.item.tolerate_absent | default(false))
      tags: [act4]

    - name: "act4: directory-type sub-pass (a+rX,go-w, recurse) for the 5 non-key dirs (BC-1/E-2); keys/ handled separately (D6)"
      ansible.builtin.file:
        path: "{{ repo }}/.gleipnir/{{ item.item.relative }}"
        mode: "a+rX,go-w"
        recurse: true
      loop: "{{ enforcement_dir_stat.results | rejectattr('item.relative', 'equalto', 'keys') | list }}"
      loop_control:
        label: "{{ item.item.label }}"
      when: item.stat.exists
      tags: [act4]

    # -----------------------------------------------------------------------
    # D6: keys/ exclude-the-key treatment (Option A, find-based). keys/ was
    # rejected from the loop above; it is handled here on its own so
    # marker.key's mode is NEVER touched by act4 -- act5 owns it exclusively
    # (BC-2). Gated on the same stat entry the fail-fast task above already
    # asserts is present-or-halted, so by this point keys/ is known to exist.
    # -----------------------------------------------------------------------
    - name: "act4: locate the keys/ stat entry for the exclude-the-key special-case (D6)"
      ansible.builtin.set_fact:
        keys_dir_stat_entry: "{{ (enforcement_dir_stat.results | selectattr('item.relative', 'equalto', 'keys') | list | first) }}"
      tags: [act4]

    - name: "act4: harden the keys/ DIRECTORY NODE itself (a+rX,go-w, NO recurse) -- D6"
      ansible.builtin.file:
        path: "{{ repo }}/.gleipnir/keys"
        mode: "a+rX,go-w"
        state: directory
      when: keys_dir_stat_entry.stat.exists
      tags: [act4]

    - name: "act4: enumerate keys/ CONTENTS excluding *.key (D6) -- README.md, future *.digest files"
      ansible.builtin.find:
        paths: "{{ repo }}/.gleipnir/keys"
        recurse: true
        file_type: any
        excludes: "*.key"
      register: keys_non_key_contents
      when: keys_dir_stat_entry.stat.exists
      tags: [act4]

    - name: "act4: harden keys/ non-key contents (a+rX,go-w) -- D6 excludes marker.key, act5 owns it exclusively (BC-2)"
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "a+rX,go-w"
      loop: "{{ keys_non_key_contents.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      when: keys_dir_stat_entry.stat.exists
      tags: [act4]

    # =======================================================================
    # act 5 -- G-3 key RO_AND_UNREADABLE. Kept running AFTER act4 (P6/BC-2)
    # per the operator-preserved ordering, though D6 means act-4's keys/
    # handling no longer touches marker.key AT ALL (the `find: excludes:
    # *.key` special-case above skips it) -- so the two acts are now
    # independent for the key file itself; the after-act4 placement is
    # retained as defense-in-depth / least-surprise, not because act4 would
    # still loosen the key if act5 ran first. Unconditional in BOTH modes
    # (BC-3) -- never gated on mode/teardown.
    # =======================================================================
    - name: "act5: verify the G-3 key exists before locking it (E-7)"
      ansible.builtin.stat:
        path: "{{ repo }}/.gleipnir/{{ marker_key_relpath }}"
      register: marker_key_stat
      tags: [act5]

    - name: "act5: fail fast if the G-3 key is missing (E-7)"
      ansible.builtin.fail:
        msg: "G-3 marker key not found at {{ repo }}/.gleipnir/{{ marker_key_relpath }} -- generate it before running this playbook."
      when: not marker_key_stat.stat.exists
      tags: [act5]

    - name: "act5: lock the G-3 key RO_AND_UNREADABLE (mode 600) -- MUST run after act4 (BC-2/P6); unconditional floor in both modes (BC-3)"
      ansible.builtin.file:
        path: "{{ repo }}/.gleipnir/{{ marker_key_relpath }}"
        owner: "{{ operator }}"
        group: staff
        mode: "0600"
        state: file
      tags: [act5]

    # =======================================================================
    # act 6 -- install the launch wrapper's perms/ownership. Does NOT author
    # or rewrite bin/gleipnir-launch (already written+reviewed) -- only
    # installs perms, matching the plan's "installs perms/ownership, does
    # not author the file."
    # =======================================================================
    - name: "act6: install bin/gleipnir-launch perms/ownership (0755, operator:staff)"
      ansible.builtin.file:
        path: "{{ repo }}/bin/gleipnir-launch"
        owner: "{{ operator }}"
        group: staff
        mode: "0755"
        state: file
      tags: [act6]

    # =======================================================================
    # AC-4 -- the FAILING assertion (BC-7): the authoritative caged signal
    # is only ever the preflight verdict, never playbook success. The
    # `environment:` fix is REQUIRED (BC-4/E-4): sudo's env_reset strips
    # GLEIPNIR_MARKER_KEY_FILE from the interactive shell before this
    # process runs, so it must be re-set explicitly at the task level.
    # =======================================================================
    - name: "AC-4: run the caged preflight (fails closed unless CLOSED) -- environment fix survives sudo (BC-4/E-4)"
      ansible.builtin.command:
        cmd: >-
          {{ repo }}/bin/gleipnir-preflight
          --agent-uid {{ agent_uid }} --agent-gid {{ agent_gid }} --mode caged
      environment:
        GLEIPNIR_MARKER_KEY_FILE: "{{ repo }}/.gleipnir/{{ marker_key_relpath }}"
      register: ac4_preflight
      changed_when: false
      failed_when: false
      when: not ansible_check_mode   # E-8: command: tasks don't support --check
      tags: [ac4]

    - name: "AC-4: assert the caged boundary is genuinely CLOSED (rc == 0) -- never a false green (BC-7)"
      ansible.builtin.assert:
        that:
          - (ac4_preflight.rc | default(1)) == 0
        fail_msg: >-
          S-2 caged boundary NOT closed (preflight rc={{ ac4_preflight.rc | default('N/A -- check mode') }}):
          {{ ac4_preflight.stdout | default('') }} {{ ac4_preflight.stderr | default('') }}
        success_msg: "AC-4 passed: S-2 caged boundary CLOSED (preflight rc=0)."
      when: not ansible_check_mode   # E-8: mirrors the command task's guard above
      tags: [ac4]
