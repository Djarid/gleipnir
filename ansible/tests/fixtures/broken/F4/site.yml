---
# ansible/tests/fixtures/broken/_canonical/site.yml
#
# Canonical fixture: a MINIMAL stand-in for the real production
# ansible/site.yml, containing only what signer-static.sh's S5 check
# examines -- act 1's adoption of the shared account-creation task-file.
# This is NOT the real site.yml (428 lines, untouched by this plan except
# at act 1); it exists only so signer-static.sh has something to check
# S5 against inside this fixture tree.

- name: gleipnir agent-account provisioning (fixture stand-in)
  hosts: local
  gather_facts: false

  vars:
    agent_account_name: gleipnir-agent

  tasks:
    - name: "act1: create the agent service account (inline, pre-extraction)"
      ansible.builtin.command: dscl . -create /Groups/{{ agent_account_name }} PrimaryGroupID {{ agent_gid }}
      changed_when: true

    - name: "act1: create the agent user (inline, pre-extraction)"
      ansible.builtin.command: sysadminctl -addUser {{ agent_account_name }} -UID {{ agent_uid }} -GID {{ agent_gid }} -home /var/empty -shell /usr/bin/false
      changed_when: true
