---
# ansible/group_vars/all.yml
#
# repo path, agent account NAME, key path, and the 8-entry enforcement-path
# mirror of src/gleipnir/preflight/boundary.py's ENFORCEMENT_PATHS
# (lines 168-222). Per P3/BC-6: NO numeric uid/gid appear here, or anywhere
# else in this playbook -- those are READ at play-start from
# .gleipnir/agent-identity.env (the single source of truth this playbook,
# bin/gleipnir-launch, and bin/gleipnir-preflight all consume identically).
#
# `ansible/tests/layer1-static.sh`'s AC-mirror / AC-nolit checks assert this
# file honours both invariants; keep this file and boundary.py's LOCKED
# tuple in lockstep (BC-1: mechanise, never re-author).

# Default assumes the playbook is run from a checkout with `ansible/` at the
# repo root (the normal case: `ansible-playbook -i inventory.ini site.yml`
# from inside `ansible/`, or with explicit `-i ansible/inventory.ini
# ansible/site.yml` from the repo root). Override with `-e repo=...` to
# point at a disposable fixture tree in tests (see ansible/tests/).
repo: "{{ playbook_dir }}/.."

# The dedicated non-login agent account name (act 1/3). The NUMERIC uid/gid
# for this account are read from agent-identity.env at play start, never
# declared here.
agent_account_name: gleipniragent

# The G-3 marker key, relative to {{ repo }}/.gleipnir (act 5 / AC-4).
marker_key_relpath: keys/marker.key

# Tier-0/1/2 dirs the agent account may WRITE (act 3) -- everything else
# under .gleipnir/ stays read-only to the agent uid.
tier012_writable_dirs:
  - .gleipnir/plans
  - .gleipnir/var/tmp
  - .gleipnir/logs
  - .gleipnir/memory
  - .gleipnir/lessons

# D5 (non-overlapping layering, idempotency fix): the ONLY .gleipnir/
# subtrees act-3 recurses `a+rX` into, besides the non-recursive top-level
# traverse grant on .gleipnir/ itself. This list is deliberately DISJOINT
# from `enforcement_paths` below and from `keys/` -- those are owned
# exclusively by act-4/act-5. The first real test run showed that a broad
# `chmod -R a+rX .gleipnir` (the proposal's literal form) OVERLAPS the
# enforcement subtree act-4 (go-w) and the key act-5 (0600) then tighten,
# so every re-run re-loosened what the later acts re-tightened -- forever
# non-idempotent (see ../../.gleipnir/decisions/s2-caged-ansible.md D5).
# Each entry TOLERATES ABSENCE (unlike `enforcement_paths`, where only
# `plugins` tolerates absence) -- these are optional non-essential
# subtrees, not LOCKED paths, so a missing one is not a failure, just
# nothing to grant read on. Add future non-enforcement, non-Tier-0/1/2
# readable subtrees here, never by re-broadening the .gleipnir/ recurse.
non_enforcement_readable_dirs:
  - skills
  - policy

# The 8 LOCKED enforcement paths (act 4) -- SAME set, SAME order, as
# src/gleipnir/preflight/boundary.py:168-222's ENFORCEMENT_PATHS tuple.
# `relative` is the path relative to {{ repo }}/.gleipnir, matching
# boundary.py's own `relative` field verbatim. Only the "plugins" item
# carries a tolerate_absent value of true (mirroring boundary.py's
# EnforcementPath(..., tolerate_absent=True) on plugins/** alone) --
# every other path missing entirely is a real failure, not a tolerated
# absence (E-2/BC-1).
#
# `kind: dir|file` (BUG-1, real-world Ansible act-4 correctness defect) --
# two of the eight paths (stage-role-map.md, AGENTS.md) are FILES, not
# directories, and `ansible.builtin.file` errors ("recurse option requires
# state to be 'directory'") if `recurse: yes` is applied to a file. `kind`
# lets site.yml's act-4 tasks split the single `enforcement_paths` list
# (still ONE source of truth, still the same 8-entry/8-order set the
# AC-mirror test checks) into a file-mode sub-pass (mode 0644, no recurse)
# and a dir-recurse sub-pass (mode a+rX,go-w, recurse), matching
# ../plans/s2-activation-control-proposal.md act (4)'s own
# `chmod 644 agents/*.md stage-role-map.md AGENTS.md` (files) vs.
# `chmod -R a+rX,go-w agents decisions goals keys sandbox plugins` (dirs)
# split verbatim.
enforcement_paths:
  - label: "agents/*.md"
    relative: agents
    kind: dir
    tolerate_absent: false
  - label: "stage-role-map.md"
    relative: stage-role-map.md
    kind: file
    tolerate_absent: false
  - label: "decisions/**"
    relative: decisions
    kind: dir
    tolerate_absent: false
  - label: "goals/**"
    relative: goals
    kind: dir
    tolerate_absent: false
  - label: "keys/**"
    relative: keys
    kind: dir
    tolerate_absent: false
  - label: "plugins/**"
    relative: plugins
    kind: dir
    tolerate_absent: true
  - label: "sandbox/**"
    relative: sandbox
    kind: dir
    tolerate_absent: false
  - label: "AGENTS.md"
    relative: AGENTS.md
    kind: file
    tolerate_absent: false
