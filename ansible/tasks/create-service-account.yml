---
# ansible/tasks/create-service-account.yml
#
# The shared, parameterised task-file for creating a macOS (Darwin)
# non-login service account, gated on a mismatch-free absence check. Both
# `ansible/signer.yml` and `ansible/site.yml`'s act 1 consume this SAME file
# (C6 -- one extracted, shared task-file, not a duplicated fallback): each
# caller passes its own `svc_*` params (site.yml: the dedicated agent
# account; signer.yml: the dedicated signer account) and neither duplicates
# the dscl/sysadminctl logic inline.
#
# Guard shape (J8 -- three-way, applied uniformly): absent -> create;
# present-and-all-attributes-match -> skip (changed=false); present-with-
# ANY-mismatch -> fail naming the attribute, expected vs found; a genuine
# dscl operational error (not a clean not-found) -> fail loudly, never
# silently treated as absent.

- name: "assert required svc_* variables are defined"
  ansible.builtin.assert:
    that:
      - svc_account_name is defined
      - svc_uid is defined
      - svc_gid is defined
      - svc_fullname is defined
      - svc_home is defined
      - svc_shell is defined
    fail_msg: >-
      svc_account_name, svc_uid, svc_gid, svc_fullname, svc_home and
      svc_shell must all be defined before including this task-file.
    quiet: true

- name: "query existing service account user record (dscl) -- idempotency guard"
  ansible.builtin.command: dscl . -read /Users/{{ svc_account_name }} UniqueID PrimaryGroupID UserShell NFSHomeDirectory
  register: user_q
  changed_when: false
  failed_when: false

- name: "query existing service account group record (dscl) -- idempotency guard"
  ansible.builtin.command: dscl . -read /Groups/{{ svc_account_name }} PrimaryGroupID
  register: group_q
  changed_when: false
  failed_when: false

- name: "classify the user query result: clean not-found vs found vs operational error"
  ansible.builtin.set_fact:
    user_absent: "{{ user_q.rc != 0 and ('eDSRecordNotFound' in (user_q.stderr | default('')) or '-14136' in (user_q.stderr | default(''))) }}"
    user_present: "{{ user_q.rc == 0 }}"

- name: "classify any remaining non-clean-absent user failure as an operational error"
  ansible.builtin.set_fact:
    user_query_error: "{{ user_q.rc != 0 and not user_absent }}"

- name: "classify the group query result: clean not-found vs found vs operational error"
  ansible.builtin.set_fact:
    group_absent: "{{ group_q.rc != 0 and ('eDSRecordNotFound' in (group_q.stderr | default('')) or '-14136' in (group_q.stderr | default(''))) }}"
    group_present: "{{ group_q.rc == 0 }}"

- name: "classify any remaining non-clean-absent group failure as an operational error"
  ansible.builtin.set_fact:
    group_query_error: "{{ group_q.rc != 0 and not group_absent }}"

# regex_search with a capture group returns a LIST of captures; unwrap it with
# `| first` (and default to '' so a non-match yields a comparable empty string,
# never an undefined/list value) BEFORE any int/string comparison.
# regex_search with a capture group returns a LIST of captures on a match, but
# None on NO match (e.g. an absent account with empty stdout). `None | first`
# raises "'NoneType' object is not iterable", so coerce a non-match to [] with
# `| default([], true)` BEFORE `| first`, then default the (possibly-absent)
# first element to '' so every parsed_* fact is a comparable scalar string.
- name: "parse the existing user record's attributes for exact comparison"
  ansible.builtin.set_fact:
    parsed_uid: "{{ (user_q.stdout | regex_search('UniqueID: (\\d+)', '\\1') | default([], true) | first) | default('', true) }}"
    parsed_gid: "{{ (user_q.stdout | regex_search('PrimaryGroupID: (\\d+)', '\\1') | default([], true) | first) | default('', true) }}"
    parsed_shell: "{{ (user_q.stdout | regex_search('UserShell: (\\S+)', '\\1') | default([], true) | first) | default('', true) }}"
    parsed_home: "{{ (user_q.stdout | regex_search('NFSHomeDirectory: (\\S+)', '\\1') | default([], true) | first) | default('', true) }}"

- name: "parse the existing group record's PrimaryGroupID for exact comparison"
  ansible.builtin.set_fact:
    parsed_group_gid: "{{ (group_q.stdout | regex_search('PrimaryGroupID: (\\d+)', '\\1') | default([], true) | first) | default('', true) }}"

- name: "compare existing user attributes against the desired values (exact, not substring)"
  ansible.builtin.set_fact:
    attrs_mismatch: >-
      {{ user_present and ((parsed_uid | string) != (svc_uid | string)
         or (parsed_gid | string) != (svc_gid | string)
         or (parsed_shell | string) != (svc_shell | string)
         or (parsed_home | string) != (svc_home | string)) }}

- name: "compare existing group record's PrimaryGroupID against the desired gid (exact)"
  ansible.builtin.set_fact:
    group_mismatch: "{{ group_present and ((parsed_group_gid | string) != (svc_gid | string)) }}"

- name: "fail loudly on a genuine dscl USER operational error (not a clean not-found)"
  ansible.builtin.fail:
    msg: >-
      dscl user query for {{ svc_account_name }} failed operationally (rc=
      {{ user_q.rc }}), and the failure is NOT a clean not-found
      (eDSRecordNotFound / -14136). Refusing to guess whether the account
      is absent or present. stderr: {{ user_q.stderr }}
  when: user_query_error

- name: "fail loudly on a genuine dscl GROUP operational error (not a clean not-found)"
  ansible.builtin.fail:
    msg: >-
      dscl group query for {{ svc_account_name }} failed operationally (rc=
      {{ group_q.rc }}), and the failure is NOT a clean not-found
      (eDSRecordNotFound / -14136). Refusing to guess whether the group is
      absent or present. stderr: {{ group_q.stderr }}
  when: group_query_error

- name: "fail on existing-account attribute mismatch"
  ansible.builtin.fail:
    msg: >-
      Existing account {{ svc_account_name }} does not match the desired
      attributes. expected: uid={{ svc_uid }} gid={{ svc_gid }}
      shell={{ svc_shell }} home={{ svc_home }}; found: uid={{ parsed_uid }}
      gid={{ parsed_gid }} shell={{ parsed_shell }} home={{ parsed_home }}.
  when: user_present and attrs_mismatch

- name: "fail on existing-group attribute mismatch"
  ansible.builtin.fail:
    msg: >-
      Existing group {{ svc_account_name }} does not match the desired
      PrimaryGroupID: expected {{ svc_gid }}, found {{ parsed_group_gid }}.
  when: group_mismatch

# Creation runs only when BOTH the user is genuinely absent AND no mismatch/
# error path fired. The user + group creation is one guarded unit: if the user
# is absent we (re)assert the group then create the user. A group that is
# present-and-matching is left as-is (the create is idempotent at the dscl
# level and the group_mismatch fail above already caught a wrong-gid group).
- name: "create the service account group record (dscl)"
  ansible.builtin.command: dscl . -create /Groups/{{ svc_account_name }}
  when: not user_present and not attrs_mismatch
  changed_when: true

- name: "set the service account group PrimaryGroupID"
  ansible.builtin.command: dscl . -create /Groups/{{ svc_account_name }} PrimaryGroupID {{ svc_gid }}
  when: not user_present and not attrs_mismatch
  changed_when: true

- name: "set the service account group RecordName"
  ansible.builtin.command: dscl . -create /Groups/{{ svc_account_name }} RecordName {{ svc_account_name }}
  when: not user_present and not attrs_mismatch
  changed_when: true

- name: "create the non-login service account user (sysadminctl)"
  when: not user_present and not attrs_mismatch
  changed_when: true
  ansible.builtin.command: >-
    sysadminctl -addUser {{ svc_account_name }} -fullName "{{ svc_fullname }}"
    -UID {{ svc_uid }} -GID {{ svc_gid }} -home {{ svc_home }} -shell {{ svc_shell }}
