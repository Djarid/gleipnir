[project]
name = "gleipnir"
version = "0.0.1"
description = "Gleipnir enforcement framework — reference implementation"
requires-python = ">=3.11"
# Enforcement core is stdlib-only by policy (see
# .gleipnir/decisions/runtime-and-deps.md). No runtime dependencies.
dependencies = []

[project.optional-dependencies]
# Dev/test tooling only — NOT shipped, NOT in the S-2 trusted runtime surface.
# These live in the sandbox image (Containerfile); the enforcement core is
# stdlib-only. pytest-cov gives the coverage gate its line+branch numbers.
dev = ["pytest>=8,<9", "pytest-cov>=5,<6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
